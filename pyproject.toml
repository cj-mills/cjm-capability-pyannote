[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-capability-pyannote"
dynamic = ["version"]
description = "A pyannote.audio speaker-diarization capability for the cjm-substrate runtime — source audio in, anonymous time-ranged speaker turns out (community-1 pipeline by default; HF-gated). Identity stays downstream human judgment: the correction TUI's assignment lane."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['cjm-substrate>=0.0.58', 'cjm-capability-primitives>=0.0.12', 'cjm-substrate-torch-utils', 'pyannote.audio>=4.0']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-capability-pyannote"


[tool.setuptools.dynamic]
version = {attr = "cjm_capability_pyannote.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_capability_pyannote*"]
